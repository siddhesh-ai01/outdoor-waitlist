<!DOCTYPE html>
<html lang="en-IN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>You're on the list · Outdoor</title>
  <meta name="description" content="You've joined the Outdoor waitlist.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/images/icons/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="assets/images/icons/apple-touch-icon.png">
  <script>
    (function () {
      var t = 'dark';
      try { var s = localStorage.getItem('outdoor-theme'); if (s === 'light' || s === 'dark') t = s; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages.css">
  <script type="module" src="js/thanks.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="site-header">
  <div class="container nav">
    <a class="brand" href="./" aria-label="Outdoor, home">
      <svg class="glyph" viewBox="78 36 302 430" aria-hidden="true"><path d="M145 40H369a6 6 0 0 1 6 6V456a6 6 0 0 1-6 6H145V394A152 152 0 1 0 145 106Z" fill="currentColor"/><circle cx="193" cy="250" r="110" fill="#FF4E00"/></svg>
      <span class="wordmark"><span class="o">O</span>utdoor</span>
    </a>
    <nav class="nav-links" aria-label="Main">
      <a class="nav-link" href="story.html">Story</a>
      <button class="theme-btn always" type="button" data-theme-toggle aria-label="Switch to light theme">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
      </button>
    </nav>
  </div>
</header>

<main id="main" class="ty">
  <!-- The finish line: f1Flag means "a thing that is done" (docs/mascot.md) -->
  <svg class="ty-mascot" data-mascot="f1-flag" data-height="120"></svg>

  <h1 class="ty-head">
    <span class="ty-name" data-ty-name></span>
    <span class="ty-line" data-ty-line>You're on the list.</span>
  </h1>

  <!-- Shown only when the v2 Apps Script is live (it saves the answer to the same row). -->
  <div class="ty-city card" data-city hidden>
    <div class="ty-city-ask" data-city-ask>
      <p class="ty-q">Where do you play?</p>
      <div class="ty-chips" role="group" aria-label="Your city">
        <button type="button" class="pick" data-city-value="Pune" aria-pressed="false">Pune</button>
        <button type="button" class="pick" data-city-value="Mumbai" aria-pressed="false">Mumbai</button>
        <button type="button" class="pick" data-city-value="Bangalore" aria-pressed="false">Bangalore</button>
        <button type="button" class="pick" data-city-value="Delhi NCR" aria-pressed="false">Delhi NCR</button>
        <button type="button" class="pick" data-city-value="Hyderabad" aria-pressed="false">Hyderabad</button>
        <button type="button" class="pick" data-city-value="Chennai" aria-pressed="false">Chennai</button>
        <button type="button" class="pick" data-city-value="Kolkata" aria-pressed="false">Kolkata</button>
        <button type="button" class="pick" data-city-value="other" aria-pressed="false">Somewhere else</button>
      </div>
      <form class="ty-other" data-city-other hidden>
        <label class="sr-only" for="ty-other-city">Your city</label>
        <input class="input" id="ty-other-city" type="text" autocomplete="address-level2" maxlength="40" placeholder="Your city">
        <button class="btn btn-ghost" type="submit">Save</button>
      </form>
    </div>
    <p class="ty-status" data-city-status role="status" aria-live="polite"></p>
  </div>

  <div class="ty-actions">
    <a class="btn btn-primary" data-share-whatsapp href="https://wa.me/" target="_blank" rel="noopener">Share on WhatsApp</a>
    <button class="btn btn-ghost" type="button" data-share-copy>Copy link</button>
  </div>

  <a class="link-arrow ty-story" href="story.html"><span class="label">While you wait, read our story</span><span class="arrow" aria-hidden="true">→</span></a>
</main>

</body>
</html>
