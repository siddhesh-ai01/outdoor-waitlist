<!DOCTYPE html>
<html lang="en-IN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Join the waitlist · Outdoor</title>
  <meta name="description" content="Get early access to Outdoor, one app for every sport. Follow your teams, catch the day's sport news and book a court.">
  <link rel="canonical" href="https://www.theoutdoor.in/waitlist.html">
  <meta name="theme-color" content="#0A0A0A">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Outdoor">
  <meta property="og:title" content="Join the Outdoor waitlist">
  <meta property="og:description" content="Early access to one app for every sport.">
  <meta property="og:url" content="https://www.theoutdoor.in/waitlist.html">
  <meta property="og:image" content="https://www.theoutdoor.in/assets/images/og/outdoor-og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/images/icons/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="assets/images/icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preload" href="assets/fonts/Satoshi-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    (function () {
      var t = 'dark';
      try { var s = localStorage.getItem('outdoor-theme'); if (s === 'light' || s === 'dark') t = s; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages.css">
  <script type="module" src="js/join.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="site-header">
  <div class="container nav">
    <a class="brand" href="./" aria-label="Outdoor, home">
      <svg class="glyph" viewBox="78 36 302 430" aria-hidden="true"><path d="M145 40H369a6 6 0 0 1 6 6V456a6 6 0 0 1-6 6H145V394A152 152 0 1 0 145 106Z" fill="currentColor"/><circle cx="193" cy="250" r="110" fill="#FF4E00"/></svg>
      <span class="wordmark"><span class="o">O</span>utdoor</span>
    </a>
    <nav class="nav-links" aria-label="Main">
      <a class="nav-link" href="story.html">Story</a>
      <button class="theme-btn always" type="button" data-theme-toggle aria-label="Switch to light theme">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
      </button>
    </nav>
  </div>
</header>

<main id="main" class="join-page">
  <section class="join-panel has-field" aria-labelledby="wl-title">
    <div class="join-panel-inner">
      <p class="eyebrow">Early access</p>
      <h1 class="display" id="wl-title">Be first in.</h1>
      <p class="lead">Join the waitlist and we'll tell you the moment the app is ready.</p>
      <p class="count is-loading" data-count-wrap><span class="pulse" aria-hidden="true"></span><span><b data-count>0</b> people waiting</span></p>
    </div>
  </section>

  <section class="join-side" aria-label="Join the waitlist">
    <form class="form join-form" data-waitlist data-cta-zone data-launch="waitlist" novalidate>
      <label class="field-label" for="wl-name">Name</label>
      <input class="input" id="wl-name" name="name" type="text" autocomplete="name" maxlength="80" required>
      <label class="field-label" for="wl-email">Email</label>
      <input class="input" id="wl-email" name="email" type="email" inputmode="email" autocomplete="email" maxlength="120" required>
      <div class="hp" aria-hidden="true"><label for="wl-company">Company</label><input id="wl-company" name="company" type="text" tabindex="-1" autocomplete="off"></div>
      <button class="btn btn-primary" type="submit">Join the waitlist</button>
      <p class="form-msg" data-form-msg role="status" aria-live="polite"></p>
      <p class="fine">We'll only email you about Outdoor. <a href="privacy.html">Privacy policy</a></p>
    </form>
    <div class="store-cta" data-launch="store" hidden>
      <p class="lead">The app is out.</p>
      <a class="btn btn-primary" href="#" data-cta="join">Get the app</a>
    </div>
    <a class="link-arrow side-link" href="story.html"><span class="label">Read our story</span><span class="arrow" aria-hidden="true">→</span></a>
  </section>
</main>

</body>
</html>
